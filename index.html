<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidratação Farma Centro</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.hero {
  background: linear-gradient(135deg, #0ea5e9, #0369a1);
}
.img-lateral {
  max-width: 200px;
  opacity: 0.9;
}
</style>
</head>

<body class="bg-gray-100">

<!-- TOPO -->
<div class="hero text-white text-center py-10">
<h1 class="text-4xl font-bold">💧 Hidratação Farma Centro</h1>
<p>Descubra quanta água você deve beber por dia</p>
</div>

<!-- CONTEÚDO COM IMAGENS -->
<div class="flex justify-center items-center gap-6 mt-6 px-4 flex-wrap">

<!-- IMAGEM ESQUERDA -->
<img src="https://raw.githubusercontent.com/atacadaofarmacentro/HidroCheck/main/imagens/imagem.png" 
class="img-lateral hidden md:block">

<!-- APP -->
<div class="max-w-md bg-white p-6 rounded-3xl shadow-xl">

<label class="block mb-2 text-gray-600">Seu peso (kg)</label>
<input type="number" id="peso" class="w-full p-3 border rounded-xl mb-4" placeholder="Ex: 70">

<button onclick="calcularAgua()" 
class="w-full bg-blue-500 text-white py-4 rounded-2xl font-bold text-lg">
💧 CALCULAR
</button>

<div id="resultado" class="hidden mt-6 text-center">

<div id="litros" class="text-5xl font-bold text-blue-600"></div>
<div class="mt-3 text-lg text-gray-700">
Seu corpo precisa disso por dia 💙
</div>

</div>

</div>

<!-- IMAGEM DIREITA -->
<img src="https://raw.githubusercontent.com/atacadaofarmacentro/HidroCheck/main/imagens/imagem.png" 
class="img-lateral hidden md:block">

</div>

<script>
function calcularAgua(){
let peso = document.getElementById("peso").value;

if(!peso || peso <= 0){
alert("Digite seu peso corretamente");
return;
}

let ml = peso * 35;
let litros = (ml / 1000).toFixed(2);

document.getElementById("resultado").classList.remove("hidden");
document.getElementById("litros").innerHTML = litros + " L/dia";
}
</script>

</body>
</html>
